<!DOCTYPE html>
<html>
<head>
  <title>Trading Journal</title>

  <style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
    padding: 20px;
  }

  h1, h3, h4 {
    color: #f8fafc;
  }

  .container {
    max-width: 700px;
    margin: auto;
    background: #020617;
    padding: 20px;
    border-radius: 8px;
  }

  label {
    display: block;
    margin-bottom: 12px;
  }

  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border-radius: 4px;
    border: none;
    background: #020617;
    color: #e5e7eb;
    border: 1px solid #334155;
  }

  button {
    background: #2563eb;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 10px;
  }

  button:hover {
    background: #1d4ed8;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    background: #020617;
    padding: 10px;
    margin-bottom: 6px;
    border-radius: 4px;
    cursor: pointer;
    border-left: 4px solid #2563eb;
  }

  #monthlyMessage {
    margin-top: 10px;
    font-weight: bold;
  }
</style>

</head>
<body>

<div class="container">
  <h1>Digital Trading Journal</h1>

  <button onclick="location.href='./trade.html'">
    View Saved Trades
  </button>

  <h3>New Trade</h3>
  <form id="tradeForm">

<p style="color:red;font-weight:bold;">ENTRY PAGE</p>

<div class="container">
  <h1>Digital Trading Journal</h1>

  <h3>New Trade</h3>

  <form id="tradeForm">
    <label>
      Pair:
      <input type="text" id="pair" placeholder="e.g. EURUSD">
    </label>
    <br><br>

    <label>
      Direction:
      <select id="direction">
        <option>Buy</option>
        <option>Sell</option>
      </select>
    </label>
    <br><br>
<label>
  Strategy Used:
  <input list="strategyOptions" id="strategy" placeholder="Select or type strategy">
</label>

<datalist id="strategyOptions"></datalist>

    <br><br>

    <label>
      Reason for Entry:
      <input type="text" id="reason" placeholder="e.g. London session high sweep">
    </label>
    <br><br>

    <label>
      Result:
      <select id="result">
        <option>Win</option>
        <option>Loss</option>
        <option>Break-even</option>
      </select>
    </label>
    <br><br>

   <label>
  Emotion:
  <input list="emotionOptions" id="emotion" placeholder="Select or type emotion">
</label>

<datalist id="emotionOptions"></datalist>

    <br><br>

  <button type="submit">Save Trade</button>
  
  </form>

  <p id="status"></p>

<h3>Monthly Review</h3>
<button id="generateReport">Generate Monthly Report</button>

<p id="monthlyMessage"></p>

<h4>Strengths</h4>
<ul id="monthlyStrengths"></ul>

<h4>Weaknesses</h4>
<ul id="monthlyWeaknesses"></ul>

  <script>
document.getElementById("tradeForm").addEventListener("submit", function (e) {
  e.preventDefault(); // STOP page refresh

 if (
  !pair.value ||
  !strategy.value ||
  !reason.value
) {
  status.innerText = "Please fill all required fields.";
  status.style.color = "red";
  return;
}

  const trade = {
    pair: document.getElementById("pair").value,
    direction: document.getElementById("direction").value,
    strategy: document.getElementById("strategy").value,
    reason: document.getElementById("reason").value,
    result: document.getElementById("result").value,
    emotion: document.getElementById("emotion").value,
    date: new Date().toISOString()
  };

  const trades = JSON.parse(localStorage.getItem("trades")) || [];
  trades.push(trade);
  localStorage.setItem("trades", JSON.stringify(trades));

  document.getElementById("status").innerText = "Trade saved successfully.";

  this.reset(); // clear form
});

  </script>
</div>

 

</body>
</html>
